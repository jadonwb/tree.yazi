[[mgr.prepend_keymap]]
on = "t"
run = "plugin tree-vfs -- enter"
desc = "tree-vfs: enter view"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin tree-vfs -- expand"
desc = "tree-vfs: expand hovered dir"

[[mgr.prepend_keymap]]
on = "h"
run = "plugin tree-vfs -- collapse"
desc = "tree-vfs: collapse hovered dir"

[[mgr.prepend_keymap]]
on = "R"
run = "plugin tree-vfs -- refresh"
desc = "tree-vfs: force refresh"

# Increment 2: target-aware paste routed through native tasks.
[[mgr.prepend_keymap]]
on = "p"
run = "plugin tree-vfs -- paste"
desc = "tree-vfs: paste into hovered target"

[[mgr.prepend_keymap]]
on = "P"
run = "plugin tree-vfs -- paste-force"
desc = "tree-vfs: paste into hovered target (force)"

# Increment 2 option D: cd to the real path before quitting. Deliberately bound
# to `Q` (not `q`) so the stock `q` baseline, the S28 key-quit negative
# experiment, and the existing matrix keep working unchanged.
[[mgr.prepend_keymap]]
on = "Q"
run = "plugin tree-vfs -- quit"
desc = "tree-vfs: quit and write the real cwd"
